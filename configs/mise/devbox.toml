# =============================================================================
# devbox tool manifest  ->  baked into the container image at BUILD time
# =============================================================================
# This file is COPYed to /home/dev/.config/mise/config.toml inside the image and
# `mise install` runs during `docker build`. Nothing here is downloaded at
# container start-up. Changing this file means rebuilding the image.
#
# Version policy (see docs/06-maintenance.md):
#   - Language runtimes are pinned to a MAJOR version. A silent major bump
#     breaks virtualenvs, node_modules and compiled artifacts.
#   - CLI tools track "latest". They are re-resolved only when the image is
#     rebuilt, and the resulting image digest is what actually pins them.
# =============================================================================

[tools]

# --- Language runtimes (pinned: major bumps are breaking changes) ---
python = "3.14"
node   = "24"
go     = "1.26"
java   = "temurin-24"
rust   = "latest"
bun    = "latest"
uv     = "latest"
cargo-binstall = "latest"

# --- Editor & multiplexer ---
neovim = "latest"
zellij = "latest"

# --- Shell & terminal utilities ---
starship   = "latest"
zoxide     = "latest"
fzf        = "latest"
bat        = "latest"
eza        = "latest"
yazi       = "latest"
usage      = "latest"          # required by `mise completion zsh`
shellcheck = "latest"
"npm:tldr" = "latest"

# --- Search & text processing ---
ripgrep = "latest"
fd      = "latest"
jq      = "latest"
yq      = "latest"

# --- System & network ---
duf   = "latest"
dust  = "latest"
gping = "latest"
btop  = "latest"

# --- Version control ---
gh      = "latest"
lazygit = "latest"
delta   = "latest"

# --- Secrets ---
"1password-cli" = "latest"

# --- AI tooling ---
claude-code = "latest"
herdr = "latest"
agy = "latest"
"npm:@oh-my-pi/pi-coding-agent" = "latest"
#"npm:@kilocode/cli" = "latest"
#"npm:@earendil-works/pi-coding-agent" = { version = "latest", npm_args = "--ignore-scripts" }

# --- Kubernetes & infrastructure ---
kubectl    = "latest"
helm       = "latest"
helmfile   = "latest"
k9s        = "latest"
talosctl   = "latest"
cilium-cli = "latest"
argocd     = "latest"
terraform  = "latest"

# --- Databases ---
usql = "latest"
"http:sqlcl" = { version = "26.2.0.181.2110", url = "https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-26.2.0.181.2110.zip" }

# =============================================================================
# Tasks
# =============================================================================

[tasks."completions:regen"]
description = "Regenerate the shell completion cache in ~/.local/share/zsh/completions"
run = "~/.config/zsh/regen-completions.zsh"

[tasks."herdr:integrations"]
description = "Install and sync Herdr integrations for AI agents"
run = """
herdr integration install antigravity-cli
herdr integration install claude
herdr integration install omp
"""

[tasks."kube:homelab"]
description = "Pull kubeconfig + talosconfig from 1Password into ~/.kube and ~/.talos"
run = """
mkdir -p ~/.kube ~/.talos
op read "op://dotfiles/texts/homelab-kubeconfig"  > ~/.kube/config
op read "op://dotfiles/texts/homelab-talosconfig" > ~/.talos/config
chmod 600 ~/.kube/config ~/.talos/config
"""

# The `Synthetic` item must exist in the `dotfiles` vault. ~/.omp/agent/.env is
# part of OMP's native .env discovery chain, so the key never has to live in the
# shell environment. The anthropic and google-antigravity providers are OAuth
# backed and still need an interactive `/login` inside OMP - an OAuth session
# cannot be restored from a stored key.
[tasks."omp:auth"]
description = "Write the Synthetic API key from 1Password into ~/.omp/agent/.env"
run = """
mkdir -p ~/.omp/agent
printf 'SYNTHETIC_API_KEY=%s\\n' "$(op read "op://dotfiles/Synthetic/credential")" > ~/.omp/agent/.env
chmod 600 ~/.omp/agent/.env
"""

[tasks."dotfiles:sync"]
description = "Pull latest dotfiles and link configs inside devbox container"
run = """
if [ -d "$HOME/work/dotfiles" ]; then
    REPO_DIR="$HOME/work/dotfiles"
elif [ -d "$HOME/Documents/all/github/dotfiles" ]; then
    REPO_DIR="$HOME/Documents/all/github/dotfiles"
else
    REPO_DIR="$HOME/work/dotfiles"
fi

if [ ! -d "$REPO_DIR" ]; then
    printf 'Cloning dotfiles repo to %s...\n' "$REPO_DIR"
    git clone https://github.com/msavdert/dotfiles.git "$REPO_DIR"
else
    printf 'Pulling latest dotfiles in %s...\n' "$REPO_DIR"
    git -C "$REPO_DIR" pull
fi

mkdir -p "$HOME/.config" "$HOME/.config/mise" "$HOME/.config/ghostty" "$HOME/.config/zsh" "$HOME/.ssh" "$HOME/.omp/agent" "$HOME/.claude"

# Symlink dotfiles configs to container HOME
ln -sfn "$REPO_DIR/configs/zsh/.zshenv" "$HOME/.zshenv"
ln -sfn "$REPO_DIR/configs/zsh/.zshrc" "$HOME/.zshrc"
ln -sfn "$REPO_DIR/configs/zsh/regen-completions.zsh" "$HOME/.config/zsh/regen-completions.zsh"
ln -sfn "$REPO_DIR/configs/git/config" "$HOME/.gitconfig"
ln -sfn "$REPO_DIR/configs/starship.toml" "$HOME/.config/starship.toml"
ln -sfn "$REPO_DIR/configs/op-env" "$HOME/.config/op-env"
ln -sfn "$REPO_DIR/configs/mise/devbox.toml" "$HOME/.config/mise/config.toml"
ln -sfn "$REPO_DIR/configs/ghostty/config" "$HOME/.config/ghostty/config"
ln -sfn "$REPO_DIR/configs/ssh/config" "$HOME/.ssh/config"
[ -d "$REPO_DIR/configs/zellij" ] && ln -sfn "$REPO_DIR/configs/zellij" "$HOME/.config/zellij"
[ -d "$REPO_DIR/configs/nvim" ] && ln -sfn "$REPO_DIR/configs/nvim" "$HOME/.config/nvim"

# OMP config files (preserving agent.db, .env, sessions)
for f in config.yml models.yml keybindings.yml lsp.json AGENTS.md RULES.md WATCHDOG.md APPEND_SYSTEM.md agents skills hooks; do
    [ -e "$REPO_DIR/configs/omp/$f" ] && ln -sfn "$REPO_DIR/configs/omp/$f" "$HOME/.omp/agent/$f"
done

# Claude Code configs
ln -sfn "$REPO_DIR/configs/claude/settings.json" "$HOME/.claude/settings.json"
ln -sfn "$REPO_DIR/configs/claude/statusline-command.sh" "$HOME/.claude/statusline-command.sh"
[ -e "$REPO_DIR/configs/claude/statusline.sh" ] && ln -sfn "$REPO_DIR/configs/claude/statusline.sh" "$HOME/.claude/statusline.sh"
[ -d "$REPO_DIR/configs/claude/agents" ] && ln -sfn "$REPO_DIR/configs/claude/agents" "$HOME/.claude/agents"

printf '\033[0;32m[ok]\033[0m Dotfiles synced and linked successfully!\n'
"""

[settings]
npm.package_manager = "bun"
task.source_freshness_hash_contents = true

