# =============================================================================
# macOS tool manifest  ->  symlinked to ~/.config/mise/config.toml
# =============================================================================
# Deliberately small. macOS is a CLIENT, not a workshop: it opens a terminal,
# unlocks secrets and connects to the devbox. Language runtimes, editors,
# kubernetes tooling and the AI CLIs all live in the container image
# (configs/mise/devbox.toml).
#
# The test for adding something here is NOT "do I use it?" but:
#   "does the HOST shell need it, or does the code need it?"
# The second answer belongs in devbox.toml.
#
# Note that `mise prune` removes anything not listed, so deleting a line here
# uninstalls the tool on the next `./macos/setup.sh`. That is intentional - it
# is the same discipline `brew bundle cleanup` enforces for Homebrew.
# =============================================================================

[tools]

# --- Shell experience --------------------------------------------------------
# configs/zsh/.zshrc is shared between the Mac and the devbox and references
# these directly. Without them the host shell still works (every block is
# guarded) but loses its prompt, its jump command and its ls colours.
starship = "latest"     # prompt
zoxide   = "latest"     # `z` / the zs session picker
eza      = "latest"     # ls / ll / la / lt aliases
bat      = "latest"     # bcat alias

# --- Host-side utilities -----------------------------------------------------
usage       = "latest"  # required by `mise completion zsh`
gh          = "latest"  # `gh` CLI for PR/issue management; git itself auths via op, not gh
jq          = "latest"  # ad-hoc JSON without opening the devbox
fzf         = "latest"  # the ssh host picker in .zshrc
ripgrep     = "latest"  # searching this repo from the host
fd          = "latest"  # file lookups on the host
uv          = "latest"  # one-off python scripts without a devbox round-trip
claude-code = "latest"  # Claude Code CLI
agy         = "latest"  # Antigravity CLI
herdr       = "latest"  # Herdr AI agent terminal workspace manager


# --- Repo maintenance --------------------------------------------------------
shellcheck = "latest"   # linting macos/setup.sh before committing

[tasks."completions:regen"]
description = "Regenerate the shell completion cache in ~/.local/share/zsh/completions"
run = "~/.config/zsh/regen-completions.zsh"

[tasks."herdr:integrations"]
description = "Install and sync Herdr integrations for AI agents"
run = """
herdr integration install antigravity-cli
herdr integration install claude
herdr integration install omp
"""

[tasks."dotfiles:sync"]
description = "Pull latest dotfiles and link configs"
run = """
if [ -d "$HOME/work/dotfiles" ]; then
    REPO_DIR="$HOME/work/dotfiles"
elif [ -d "$HOME/Documents/all/github/dotfiles" ]; then
    REPO_DIR="$HOME/Documents/all/github/dotfiles"
else
    REPO_DIR="$HOME/work/dotfiles"
fi

if [ ! -d "$REPO_DIR" ]; then
    printf 'Cloning dotfiles repo to %s...\n' "$REPO_DIR"
    git clone https://github.com/msavdert/dotfiles.git "$REPO_DIR"
else
    printf 'Pulling latest dotfiles in %s...\n' "$REPO_DIR"
    git -C "$REPO_DIR" pull
fi

"$REPO_DIR/macos/setup.sh" --links-only
"""

[settings]
npm.package_manager = "bun"


